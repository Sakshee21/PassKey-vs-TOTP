services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-passkey_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-passkey_pass}
      POSTGRES_DB: ${POSTGRES_DB:-passkey_vs_totp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-passkey_user} -d ${POSTGRES_DB:-passkey_vs_totp}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
